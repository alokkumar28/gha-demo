name: 01 - Type 1 Workflow Input Demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - qa
          - prod

      perform_smoke_test:
        description: Execute Smoke Test
        required: true
        type: boolean
        default: true

env:
  APP_NAME: alok-demo-app
  DOCKER_USERNAME: alokkumar01
  IMAGE_TAG: v1.01

jobs:
  app-ci-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # -----------------------------
      # Display Inputs
      # -----------------------------

      - name: Display Input Value
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Perform Smoke Test: ${{ inputs.perform_smoke_test }}"

      # -----------------------------
      # Build Docker Image
      # -----------------------------

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}

      # -----------------------------
      # QA Validation
      # -----------------------------

      - name: QA Validate
        if: ${{ inputs.environment == 'qa' }}
        run: |
          echo "Performing QA Validation"
          echo "Smoke Test: ${{ inputs.perform_smoke_test }}"
          echo "Running QA Validation for ${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}"

      # -----------------------------
      # Smoke Test
      # -----------------------------

      - name: Run Container for Smoke Test
        if: ${{ inputs.perform_smoke_test }}
        run: |
          docker run -d \
            --name ${{ env.APP_NAME }} \
            -p 8080:8080 \
            ${{ env.DOCKER_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}

          echo "Waiting for application..."
          sleep 10

      - name: Execute Smoke Test
        if: ${{ inputs.perform_smoke_test }}
        run: |
          echo "Running smoke test..."

          curl --fail http://localhost:8080/

          echo "Smoke test passed."

      - name: Stop Smoke Test Container
        if: ${{ inputs.perform_smoke_test }}
        run: |
          docker stop ${{ env.APP_NAME }}
          docker rm ${{ env.APP_NAME }}

      # -----------------------------
      # Docker Login
      # -----------------------------

      - name: Docker Login
        if: ${{ inputs.environment != 'dev' }}
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -----------------------------
      # Push Docker Image
      # -----------------------------

      - name: Push Docker Image
        if: ${{ inputs.environment != 'dev' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}

      # -----------------------------
      # Kubernetes Setup
      # -----------------------------

      - name: Setup Kubernetes
        if: ${{ inputs.environment != 'dev' }}
        uses: azure/setup-kubectl@v4

      # -----------------------------
      # Create Kubernetes Manifest
      # -----------------------------

      - name: Create Kubernetes Manifest
        if: ${{ inputs.environment != 'dev' }}
        run: |
          cat <<EOF > deployment.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${{ env.APP_NAME }}
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: ${{ env.APP_NAME }}
            template:
              metadata:
                labels:
                  app: ${{ env.APP_NAME }}
              spec:
                containers:
                  - name: ${{ env.APP_NAME }}
                    image: ${{ env.DOCKER_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
                    ports:
                      - containerPort: 8080
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${{ env.APP_NAME }}
          spec:
            selector:
              app: ${{ env.APP_NAME }}
            ports:
              - protocol: TCP
                port: 80
                targetPort: 8080
            type: ClusterIP
          EOF

      # -----------------------------
      # Deploy to Kubernetes
      # -----------------------------

      - name: Deploy to Kubernetes
        if: ${{ inputs.environment != 'dev' }}
        run: |
          kubectl apply -f deployment.yaml

      # -----------------------------
      # Verify Kubernetes Deployment
      # -----------------------------

      - name: Verify Kubernetes Deployment
        if: ${{ inputs.environment != 'dev' }}
        run: |
          kubectl rollout status deployment/${{ env.APP_NAME }}

          echo "Deployment completed."

          kubectl get pods
          kubectl get services